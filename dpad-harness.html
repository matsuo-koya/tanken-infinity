<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><title>dpad</title>
<style>body{margin:0;background:#14120e;color:#b3a486;font-family:'Hiragino Mincho ProN',serif;padding:20px}
.row{display:flex;gap:36px;align-items:flex-start}figcaption{font-size:12px;margin-top:8px}</style></head>
<body><div class="row" id="root"></div>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import { Dpad } from "/src/TankenInfinity.jsx";
const log = [];
const App = () => React.createElement("div", {className:"row"},
  [5,3,1,0].map(n => React.createElement("figure", {key:n, style:{margin:0}},
    React.createElement(Dpad, { steer:n, onSteer:(w)=>{log.push(w); document.title="押: "+log.join(",");} }),
    React.createElement("figcaption", null, `残り ${n}`)))
);
createRoot(document.getElementById("root")).render(React.createElement(App));
setTimeout(()=>{ if(!log.length) document.title="dpad ready"; }, 300);
</script></body></html>
