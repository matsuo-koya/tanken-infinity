<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><title>FPS harness</title>
<style>body{margin:0;background:#14120e;color:#b3a486;font-family:serif}
figure{margin:8px}figcaption{font-size:12px;padding:4px 0}.row{display:flex;flex-wrap:wrap}</style></head>
<body><div class="row" id="root"></div>
<script type="module">
import { drawFPS } from "/src/fpsView.js";
const W = 23, H = 15;
const ITEM_TYPES = { meat:{k:"肉",e:"🍖"}, potion:{k:"薬",e:"🧪"}, gold:{k:"金",e:"💰"} };

// 広間の中央に壁の柱を一本だけ立て、四方から見る＝四つの面を個別に確かめる
const map = Array.from({length:H},()=>Array(W).fill("wall"));
for (let y=3;y<12;y++) for (let x=3;x<20;x++) map[y][x]="floor";
map[7][11] = "wall";                    // 柱
// 廊下も併せて見る（周縁の面が怪しかったため）
for (let y=0;y<H;y++) for (let x=0;x<W;x++) if (y<3||y>=12||x<3||x>=20) map[y][x]="wall";
const explored = new Set();
for (let y=0;y<H;y++) for (let x=0;x<W;x++) explored.add(y*W+x);
const mk = (x,y,head,o={}) => ({
  depth:1, map, explored, stairs:{x:-9,y:-9}, items:[], enemies:[],
  dog:{x,y,head,em:"🚶",kj:"人",name:"人",hp:30,maxHp:30}, buddy:null, combat:false, dead:false, deadTimer:0,
  ...o,
});
const beast = (o={}) => ({ dog:{x:8,y:7,head:0,em:"🐕",kj:"犬",name:"犬"}, ...o });
const cache = {};
// 打撃の合図を now より前に置き、振りの各段階を切り出す
const SW = (ms) => ({ combat:true, __sw: ms });
const hp = (v) => ({ dog:{x:8,y:7,head:0,em:"🚶",kj:"人",name:"人",hp:v,maxHp:30} });
// 背後の敵へ振り向きながら斬る場面。打撃時点で残り27度の想定
const foe = (dx,dy,ang) => ({
  dog:{x:8,y:7,head:Math.atan2(dy,dx),em:"🚶",kj:"人",name:"人",hp:30,maxHp:30},
  enemies:[{k:"鼠",e:"🐀",x:8+dx,y:7+dy,alerted:true,id:0}],
  combat:true, __ang:ang,
});
const R = Math.PI/180;
const shots = [
  ["振り向き前（真後ろの敵は見えない）", mk(8,7,0,foe(-1,0,0)), 1386, null],
  ["残り70度（従来の速さ）", mk(8,7,0,foe(-1,0,Math.PI-70*R)), 1386, 91],
  ["残り27度（接敵時の速さ）", mk(8,7,0,foe(-1,0,Math.PI-27*R)), 1386, 91],
  ["向き終えた",            mk(8,7,0,foe(-1,0,Math.PI)), 1386, 91],
];
const root = document.getElementById("root");
for (const [label, world, nw, swAgo, pkAgo] of shots) {
  const fig = document.createElement("figure");
  const cv = document.createElement("canvas");
  const CW = 360, CH = 260;
  cv.width = CW; cv.height = CH; cv.style.width = CW+"px"; cv.style.height = CH+"px";
  const cam = { x: world.dog.x+0.5, y: world.dog.y+0.5, ang: world.__ang ?? world.dog.head, of: world };
  drawFPS(cv.getContext("2d"), CW, CH, { world, cam, cache, W, H, ITEM_TYPES, now: nw ?? 1000, swingAt: swAgo == null ? 0 : (nw ?? 1000) - swAgo, pickAt: pkAgo == null ? 0 : (nw ?? 1000) - pkAgo, pickEm: "🧪" });
  const cap = document.createElement("figcaption"); cap.textContent = label;
  fig.appendChild(cv); fig.appendChild(cap); root.appendChild(fig);
}
document.title = "FPS harness ready";
</script></body></html>
